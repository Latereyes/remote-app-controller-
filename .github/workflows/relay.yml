name: relay

on:
  push:
    paths: ['relay/**', '.github/workflows/relay.yml']
  pull_request:
    paths: ['relay/**', '.github/workflows/relay.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
